[package]
name = "freyacn"
version.workspace = true
edition.workspace = true
description = "A Freya component library with Tailwind‑inspired extension traits for building beautiful, theme‑aware UIs."
license.workspace = true
readme = "README.md"
keywords = ["gui", "freya", "ui", "components", "tailwind"]
categories = ["gui", "development-tools"]

[features]
hotreload = ["freya/hotreload"]

[dependencies]
freya = { version = "0.5.0-rc.10", features = ["icons"] }
freya-core = "0.5.0-rc.10"
freya-icons = { version = "0.5.0-rc.10", features = ["lucide"] }
freyacn_macros.workspace = true
paste = "1.0.15"
rustc-hash = "2.1.3"
torin = "0.5.0-rc.10"
