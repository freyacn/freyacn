[workspace]
resolver = "3"
members = ["crates/freyacn", "crates/freyacn-macros", "crates/freyacn-cli"]

[workspace.package]
version = "0.2.1-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/freycn/freyacn-cargo-workspace"
authors = ["Bright Madueke <maduekebright399@gmail.com>"]
homepage = "https://github.com/freyacn/freyacn-cargo-workspace"
documentation = "https://docs.rs/freyacn"
readme = "README.md"
keywords = ["freya", "ui", "components", "shadcn", "tailwind"]
categories = ["gui", "development-tools"]

[workspace.dependencies]
freyacn_macros = { version = "0.2.1-alpha.1", path = "crates/freyacn-macros" }
